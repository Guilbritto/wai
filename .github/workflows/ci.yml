name: ci
on:
  push:
    branches: [main, development]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The toolchain, its components and targets come from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # wai-waycarbon's own tests, and its end-to-end test in wai (unix only).
      - uses: actions/setup-go@v5
        with:
          go-version-file: extensions/wai-waycarbon/go.mod
          cache: false
      # Only the ignored real-Claude smoke test needs Node (npx); CI does not run it.
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: 22
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The UI and agent tests start it.
      - run: cargo build -p wai-agent --bin wai-fake-agent
      - run: cargo test --workspace
      - run: go test ./...
        working-directory: extensions/wai-waycarbon

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
