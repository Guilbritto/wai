name: ci
on:
  push:
    branches: [development]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The toolchain, its components and targets come from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The Go extensions' own tests, and wai-waycarbon's end-to-end test in wai (unix only).
      - uses: actions/setup-go@v5
        with:
          go-version-file: extensions/wai-waycarbon/go.mod
          cache: false
      # Windows: Node (npx) for the ignored real-Claude smoke test, which CI does not run. macOS
      # runners ship Node; the wai-navegador test looks npx up on PATH there (it never runs it).
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: 22
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The UI and agent tests start it.
      - run: cargo build -p wai-agent --bin wai-fake-agent
      - run: cargo test --workspace
        if: runner.os != 'Windows'
      # Windows runs everything except the failures it already had when CI first ran there, listed in
      # windows-known-failures.txt; --no-fail-fast so one failing crate does not hide the others.
      - name: cargo test --workspace (known Windows failures skipped)
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --workspace --no-fail-fast -- $(grep -v -e '^#' -e '^$' .github/windows-known-failures.txt | sed 's/^/--skip /')
      - run: go vet ./...
        working-directory: extensions/wai-waycarbon
      # Its tests put a sh-script `jira` on a `:`-joined PATH: unix only.
      - run: go test ./...
        if: runner.os != 'Windows'
        working-directory: extensions/wai-waycarbon
      - run: go vet ./...
        working-directory: extensions/wai-rotinas
      # Its tests run /bin/sh scripts, and it refuses every script on Windows: unix only.
      - run: go test ./...
        if: runner.os != 'Windows'
        working-directory: extensions/wai-rotinas

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
