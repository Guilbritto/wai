[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.6.2"
edition = "2024"
publish = false

[workspace.dependencies]
gpui-kit = "=0.9.0"
agent-client-protocol = "5"
alacritty_terminal = "0.26"
portable-pty = "0.9"
similar = "2.7"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
async-channel = "2"
toml = "0.9"
toml_edit = "0.25"
dirs = "6"
thiserror = "2"
base64 = "0.22"
notify-rust = "4"
url = "2"
ignore = "0.4"
notify = "8"
# Windows paths without the `\\?\` prefix where it is not needed.
dunce = "1"

[profile.dev]
debug = "limited"

# Dependencies (GPUI stack) without debug info: keeps target/ small; our crates keep line tables.
[profile.dev.package."*"]
debug = false

[profile.release]
debug = false
