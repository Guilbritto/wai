[package]
name = "wai"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Editor highlighting. JSON comes with every grammar (gpui-component's base `tree-sitter`).
gpui-kit = { workspace = true, features = [
    "tree-sitter-bash",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
wai-agent = { path = "../wai-agent" }
wai-ext = { path = "../wai-ext" }
wai-project = { path = "../wai-project" }
wai-settings = { path = "../wai-settings" }
wai-terminal = { path = "../wai-terminal" }
anyhow.workspace = true
base64.workspace = true
notify-rust.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
similar.workspace = true
# Cargo.lock already holds it (gpui's, with these codecs); a pasted TIFF, BMP, ICO or PNM goes
# out as a PNG.
image = { version = "0.25.10", default-features = false, features = ["png", "tiff", "bmp", "ico", "pnm"] }
# Cargo.lock already holds it (gpui's, with its default features); history rows' dates.
chrono = "0.4.45"
# Cargo.lock already holds it (gpui's); the approval dialog escapes format characters with it.
unicode-properties = { version = "0.1.3", features = ["general-category"] }
# The update check's HTTPS GET (update.rs). GPUI ships no HTTP client; these are the versions
# Cargo.lock already holds (gpui-kit-assets' reqwest on wasm), with rustls on ring (no aws-lc-rs).
http-body-util = "0.1.5"
hyper = "1.12.0"
hyper-rustls = { version = "0.27.10", default-features = false, features = [
    "http1",
    "native-tokio",
    "ring",
    "tls12",
] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
tokio = { version = "1.54.1", features = ["rt", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the tree (wai-ext): the login shell's own session, killed as a group (shell_path.rs).
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"

[features]
# Scripted run, no extra dependencies: WAI_SHOT_PROMPT=<text> opens a session and sends it
# (used to measure streaming CPU on a release build with the screen locked).
# WAI_SHOT_TERMINAL=<command> opens the terminal and runs it (idle CPU with the terminal open).
demo = []
# Offscreen capture for docs/screens (needs GPUI's test-support for `render_to_image`):
# WAI_SHOT=docs/screens/fase-1-shell.png cargo run -p wai --features screenshot -- <folder>
# With WAI_SHOT_PROMPT too, the capture waits for that turn's permission card (fase-1-chat.png).
screenshot = ["demo", "gpui-kit/test-support"]

# `cargo packager --release` (docs/building.md). No `formats`: the platform default is app + dmg
# on macOS and nsis on Windows. Version: the workspace's.
# When signing, release.yml appends [package.metadata.packager.macos] and .windows to this file.
[package.metadata.packager]
product-name = "wai"
# Placeholder bundle id; this is the one place to change it.
identifier = "app.wai.ide"
# Only the app: the fake agent and extension are test binaries of other crates.
binaries = [{ path = "wai", main = true }]
before-packaging-command = "cargo build --release -p wai"
# cargo-packager builds the .icns from the pngs; NSIS needs the .ico (assets/icon/generate.sh).
icons = ["assets/icon/icon.png", "assets/icon/icon@2x.png"]
# The display font's licence (R86); on macOS, `Contents/Resources/OFL.txt`.
resources = ["assets/fonts/OFL.txt"]
nsis = { installer-icon = "assets/icon/icon.ico" }
