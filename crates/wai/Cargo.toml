[package]
name = "wai"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Editor highlighting. JSON comes with every grammar (gpui-component's base `tree-sitter`).
gpui-kit = { workspace = true, features = [
    "tree-sitter-bash",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
wai-agent = { path = "../wai-agent" }
wai-ext = { path = "../wai-ext" }
wai-project = { path = "../wai-project" }
wai-settings = { path = "../wai-settings" }
wai-terminal = { path = "../wai-terminal" }
anyhow.workspace = true
base64.workspace = true
notify-rust.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
similar.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"

[features]
# Scripted run, no extra dependencies: WAI_SHOT_PROMPT=<text> opens a session and sends it
# (used to measure streaming CPU on a release build with the screen locked).
# WAI_SHOT_TERMINAL=<command> opens the terminal and runs it (idle CPU with the terminal open).
demo = []
# Offscreen capture for docs/screens (needs GPUI's test-support for `render_to_image`):
# WAI_SHOT=docs/screens/fase-1-shell.png cargo run -p wai --features screenshot -- <folder>
# With WAI_SHOT_PROMPT too, the capture waits for that turn's permission card (fase-1-chat.png).
screenshot = ["demo", "gpui-kit/test-support"]

# `cargo packager --release` (docs/building.md). No `formats`: the platform default is app + dmg
# on macOS and nsis on Windows. Version: the workspace's.
[package.metadata.packager]
product-name = "wai"
# Placeholder bundle id; this is the one place to change it.
identifier = "app.wai.ide"
# Only the app: the fake agent and extension are test binaries of other crates.
binaries = [{ path = "wai", main = true }]
before-packaging-command = "cargo build --release -p wai"
# cargo-packager builds the .icns from the png; NSIS needs the .ico (assets/icon/generate.sh).
icons = ["assets/icon/icon.png"]
nsis = { installer-icon = "assets/icon/icon.ico" }
