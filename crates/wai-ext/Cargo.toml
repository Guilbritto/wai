[package]
name = "wai-ext"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
async-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
smol.workspace = true
thiserror.workspace = true
wai-settings = { path = "../wai-settings" }
dunce.workspace = true
# Unpacking and checking an extension package (install.rs). flate2 and sha2 were already in
# Cargo.lock; tar (MIT/Apache, cargo's own) reads GNU and pax headers, without xattr.
flate2 = "1"
sha2 = "0.10.9"
tar = { version = "0.4.46", default-features = false }

[target.'cfg(unix)'.dependencies]
# Already in the tree (agent-client-protocol): kills an extension's whole process group.
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
# Already in the tree: a job object kills an extension's whole process tree.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
