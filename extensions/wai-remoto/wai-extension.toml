id = "wai-remoto"
name = "Remoto"
version = "0.1.0"
description = "Follow and drive your sessions from your phone, through a Tailscale tunnel"
api = "1.10"
permissions = ["process", "panels", "sessions:read", "sessions:content", "sessions:control", "notify", "listen"]

[process]
command = "bin/wai-remoto"

[[contributes.panels]]
id = "remoto"
title = "Remoto"
