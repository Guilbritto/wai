id = "wai-waycarbon"
name = "WayCarbon"
version = "0.5.0"
api = "1.5"
description = "What needs you at WayCarbon: PRs, reviews, Jira cards and help requests, one click from the right /waycarbon command"
permissions = ["process", "panels", "bar", "sessions:control", "sessions:read", "notify", "network"]

[process]
command = "bin/wai-waycarbon"

[[requires.claude_plugins]]
name = "waycarbon"
marketplace = "waycarbon/claude-code"

[[contributes.panels]]
id = "waycarbon"
title = "WayCarbon"
icon = "icon.svg"

[[contributes.items]]
id = "attention"
bar = "bottom"
title = "WayCarbon: needs you"

[[contributes.templates]]
name = "WayCarbon front"
prompt = """Work in waycarbon-ecosystem-front (TypeScript, React).
Conventions: commits use feat:/fix:/refactor: without a scope and end with `Refs: EC-XXXX`. Branch from development as feat/EC-XXXX-short-description. The PR title ends with the EC key.
Task: """

[[contributes.templates]]
name = "WayCarbon BFF"
prompt = """Work in waycarbon-ecosystem-bff (TypeScript, Node).
Conventions: commits use feat:/fix:/refactor: without a scope and end with `Refs: EC-XXXX`. Branch from development as feat/EC-XXXX-short-description. The PR title ends with the EC key.
Task: """

[[contributes.templates]]
name = "WayCarbon Go service"
prompt = """Work in a WayCarbon Go service. Write idiomatic Go and keep gofmt, go vet and go test clean.
Conventions: commits use feat:/fix:/refactor: without a scope and end with `Refs: EC-XXXX`. Branch from development as feat/EC-XXXX-short-description. The PR title ends with the EC key.
Task: """
