id = "wai-bichinho"
name = "Bichinho"
version = "0.2.1"
description = "A small pet beside your prompt box that grows with your agents' finished turns"
api = "1.7"
permissions = ["process", "panels", "sessions:read", "events:wai-waycarbon"]

[process]
command = "bin/wai-bichinho"

[[contributes.panels]]
id = "pet"
title = "Pet"
location = "prompt-side"
width = 160
frame = false

[[contributes.panels]]
id = "card"
title = "Pet card"
icon = "paw-print"
