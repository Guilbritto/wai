id = "wai-bichinho"
name = "Bichinho"
version = "0.6.0"
description = "A small pet that walks in a dock at the foot of the sidebar, grows with your agents' finished turns, evolves, and talks in a personality Claude writes from its stats"
api = "1.12"
permissions = ["process", "panels", "sessions:read", "events:wai-waycarbon"]

[process]
command = "bin/wai-bichinho"

[[contributes.panels]]
id = "pet"
title = "Pet"
location = "sidebar-foot"

[[contributes.panels]]
id = "card"
title = "Pet card"
icon = "paw-print"
