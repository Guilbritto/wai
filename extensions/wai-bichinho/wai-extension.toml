id = "wai-bichinho"
name = "Bichinho"
version = "0.7.0"
description = "A small pet that walks in a dock at the foot of the sidebar, grows with your agents' finished turns, evolves, talks in a personality Claude writes from its stats, and answers @<name> in a background session"
api = "1.13"
permissions = ["process", "panels", "sessions:read", "sessions:content", "sessions:control", "mentions", "events:wai-waycarbon"]

[process]
command = "bin/wai-bichinho"

[[contributes.panels]]
id = "pet"
title = "Pet"
location = "sidebar-foot"

[[contributes.panels]]
id = "card"
title = "Pet card"
icon = "paw-print"
